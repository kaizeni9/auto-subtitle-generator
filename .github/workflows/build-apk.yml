name: Build DiyAutoSub

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM=$(command -v sdkmanager || true); fi
          if [ -z "$SDKM" ]; then
            echo "NO SDKMANAGER FOUND; ANDROID_HOME=$ANDROID_HOME"
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi
          echo "using $SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Rename APKs
        run: |
          cd app/build/outputs/apk/debug
          for f in *.apk; do mv "$f" "diyautosub-${f}"; done

      - uses: actions/upload-artifact@v4
        with:
          name: DiyAutoSub
          path: app/build/outputs/apk/debug/*.apk

      - name: Save error details
        if: failure()
        run: |
          {
            echo "PATH=$PATH"
            echo "ANDROID_HOME=$ANDROID_HOME"
            which sdkmanager || true
            ls -la "$ANDROID_HOME" 2>/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version 2>&1 || true
          } > build-feilmelding.txt
          git config user.name "kaizeni9"
          git config user.email "kaizeni9@users.noreply.github.com"
          git add build-feilmelding.txt
          git commit -m "build diagnostics" || exit 0
          git push origin HEAD:diagnostics --force
